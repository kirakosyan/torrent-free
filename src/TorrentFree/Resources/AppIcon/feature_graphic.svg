<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1024" height="500" viewBox="0 0 1024 500" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Wide gradient background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B1E" />
      <stop offset="40%" stop-color="#0F1740" />
      <stop offset="100%" stop-color="#1B3A8A" />
    </linearGradient>
    <!-- Top-left purple glow -->
    <radialGradient id="glow1" cx="20%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#070B1E" stop-opacity="0" />
    </radialGradient>
    <!-- Bottom-right cyan glow -->
    <radialGradient id="glow2" cx="80%" cy="75%" r="45%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#070B1E" stop-opacity="0" />
    </radialGradient>
    <!-- Center accent glow behind icon -->
    <radialGradient id="glow3" cx="30%" cy="50%" r="25%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#070B1E" stop-opacity="0" />
    </radialGradient>
    <!-- Icon ring gradient -->
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <!-- Glass fill -->
    <linearGradient id="glass" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>
    <!-- Arrow gradient -->
    <linearGradient id="arrow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#A5F3FC" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <!-- Speed line gradient -->
    <linearGradient id="speed" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>
    <!-- Text gradient -->
    <linearGradient id="textgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#A5F3FC" />
    </linearGradient>
    <!-- Subtitle color -->
    <linearGradient id="subgrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <!-- Filters -->
    <filter id="boltglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="ringglow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="textglow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="500" fill="url(#bg)" />
  <rect width="1024" height="500" fill="url(#glow1)" />
  <rect width="1024" height="500" fill="url(#glow2)" />
  <rect width="1024" height="500" fill="url(#glow3)" />

  <!-- Subtle grid/mesh pattern for tech feel -->
  <g opacity="0.04" stroke="#38BDF8" stroke-width="0.5" fill="none">
    <line x1="0" y1="100" x2="1024" y2="100" />
    <line x1="0" y1="200" x2="1024" y2="200" />
    <line x1="0" y1="300" x2="1024" y2="300" />
    <line x1="0" y1="400" x2="1024" y2="400" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="800" y1="0" x2="800" y2="500" />
  </g>

  <!-- Decorative diagonal streaks (tech/speed feel) -->
  <g opacity="0.06">
    <line x1="50" y1="500" x2="250" y2="0" stroke="url(#ring)" stroke-width="1" />
    <line x1="150" y1="500" x2="350" y2="0" stroke="url(#ring)" stroke-width="0.5" />
    <line x1="800" y1="500" x2="1000" y2="0" stroke="url(#ring)" stroke-width="1" />
    <line x1="850" y1="500" x2="1050" y2="0" stroke="url(#ring)" stroke-width="0.5" />
  </g>

  <!-- Floating particles across the banner -->
  <circle cx="120" cy="80" r="2" fill="#A78BFA" opacity="0.4" />
  <circle cx="900" cy="120" r="2.5" fill="#38BDF8" opacity="0.35" />
  <circle cx="780" cy="410" r="1.8" fill="#34D399" opacity="0.3" />
  <circle cx="950" cy="320" r="2" fill="#A78BFA" opacity="0.25" />
  <circle cx="60" cy="380" r="1.5" fill="#38BDF8" opacity="0.3" />
  <circle cx="480" cy="60" r="1.5" fill="#34D399" opacity="0.35" />
  <circle cx="520" cy="440" r="2" fill="#A78BFA" opacity="0.3" />

  <!-- ===== ICON (left-center area) ===== -->
  <g transform="translate(260 250)">
    <!-- Outer glowing ring -->
    <circle cx="0" cy="0" r="130" fill="none" stroke="url(#ring)" stroke-width="4" opacity="0.5" filter="url(#ringglow)" />
    <!-- Main glass circle -->
    <circle cx="0" cy="0" r="115" fill="url(#glass)" />
    <!-- Highlight arc -->
    <path d="M -74 -88 A 115 115 0 0 1 74 -88" fill="none" stroke="white" stroke-width="1.2" opacity="0.1" />
    <!-- Speed lines -->
    <rect x="-80" y="-10" width="46" height="2.5" rx="1.25" fill="url(#speed)" opacity="0.5" />
    <rect x="-72" y="7" width="33" height="2" rx="1" fill="url(#speed)" opacity="0.35" />
    <rect x="-66" y="-26" width="29" height="1.8" rx="0.9" fill="url(#speed)" opacity="0.25" />
    <!-- Download bolt -->
    <g filter="url(#boltglow)">
      <path d="M -7 -62 L 7 -62 L 7 20 L 30 20 L 0 60 L -30 20 L -7 20 Z" fill="url(#arrow)" />
    </g>
    <!-- Data particles -->
    <circle cx="50" cy="-46" r="4" fill="#38BDF8" opacity="0.7" />
    <circle cx="62" cy="-28" r="2.5" fill="#A78BFA" opacity="0.5" />
    <circle cx="58" cy="42" r="3.2" fill="#34D399" opacity="0.6" />
    <circle cx="-54" cy="46" r="2.8" fill="#38BDF8" opacity="0.4" />
  </g>

  <!-- ===== TEXT (right side) ===== -->
  <g>
    <!-- App name -->
    <text x="580" y="225" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="700" font-size="72" fill="url(#textgrad)" letter-spacing="-1">
      Torrent Free
    </text>
    <!-- Tagline -->
    <text x="583" y="275" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="400" font-size="24" fill="url(#subgrad)" letter-spacing="0.5" opacity="0.9">
      Fast. Private. Free downloads.
    </text>
    <!-- Subtle underline accent -->
    <rect x="583" y="290" width="180" height="2" rx="1" fill="url(#ring)" opacity="0.4" />
  </g>
</svg>
