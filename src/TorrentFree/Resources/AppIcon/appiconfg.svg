<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Outer ring glow gradient -->
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <!-- Inner glass surface -->
    <linearGradient id="glass" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.95" />
    </linearGradient>
    <!-- Arrow/bolt gradient -->
    <linearGradient id="arrow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#A5F3FC" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <!-- Speed lines gradient -->
    <linearGradient id="speed" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>
    <!-- Glow filter for the bolt -->
    <filter id="boltglow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- Subtle outer glow filter for ring -->
    <filter id="ringglow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(228 228)">
    <!-- Outer glowing ring -->
    <circle cx="0" cy="0" r="158" fill="none" stroke="url(#ring)" stroke-width="5" opacity="0.6" filter="url(#ringglow)" />

    <!-- Main circle background with glass effect -->
    <circle cx="0" cy="0" r="140" fill="url(#glass)" />

    <!-- Subtle inner highlight arc (top) -->
    <path d="M -90 -108 A 140 140 0 0 1 90 -108" fill="none" stroke="white" stroke-width="1.5" opacity="0.12" />

    <!-- Speed lines (horizontal streaks showing motion) -->
    <rect x="-95" y="-12" width="55" height="3" rx="1.5" fill="url(#speed)" opacity="0.5" />
    <rect x="-85" y="8" width="40" height="2.5" rx="1.25" fill="url(#speed)" opacity="0.35" />
    <rect x="-78" y="-30" width="35" height="2" rx="1" fill="url(#speed)" opacity="0.25" />

    <!-- Download bolt/arrow — bold geometric style -->
    <g filter="url(#boltglow)">
      <!-- Main downward arrow shaft -->
      <path d="
        M -8 -75
        L  8 -75
        L  8  25
        L  36  25
        L  0  72
        L -36  25
        L -8  25
        Z
      " fill="url(#arrow)" />
    </g>

    <!-- Small accent dots (data particles) -->
    <circle cx="60" cy="-55" r="5" fill="#38BDF8" opacity="0.7" />
    <circle cx="75" cy="-35" r="3" fill="#A78BFA" opacity="0.5" />
    <circle cx="70" cy="50" r="4" fill="#34D399" opacity="0.6" />
    <circle cx="-65" cy="55" r="3.5" fill="#38BDF8" opacity="0.4" />
  </g>
</svg>
