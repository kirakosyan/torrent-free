name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Run core regression tests
        run: dotnet test --project tests/TorrentFree.UnitTests/TorrentFree.UnitTests.csproj --configuration Release

  app-build:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - framework: net10.0-windows10.0.19041.0
            workload: maui-windows
            galaxyStoreBuild: false
          - framework: net10.0-android
            workload: maui-android
            galaxyStoreBuild: false
          - framework: net10.0-android
            workload: maui-android
            galaxyStoreBuild: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        if: matrix.workload == 'maui-android'
        with:
          distribution: temurin
          java-version: '21'
      - name: Install MAUI workload
        run: dotnet workload install ${{ matrix.workload }}
      - name: Compile app
        run: dotnet build src/TorrentFree/TorrentFree.csproj --configuration Debug -f ${{ matrix.framework }} -p:AppTargetFramework=${{ matrix.framework }} -p:GalaxyStoreBuild=${{ matrix.galaxyStoreBuild }}
